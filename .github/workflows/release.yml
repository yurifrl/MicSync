name: Release

# Tag-closed releases: push a `v*` tag (e.g. v1.0) and this workflow builds the
# app, signs it with Developer ID (hardened runtime), notarizes it, wraps the
# stapled app in a signed + notarized DMG, and publishes a GitHub Release.
# A failed gate leaves the tag without a release — no unsigned fallback.
#
# workflow_dispatch runs are validation runs only: they exercise the pipeline
# and fail fast at the signing step.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Developer ID signing identity (P12)
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/signing.p12"
          echo -n "$MACOS_SIGNING_P12_BASE64" | base64 --decode -o "$p12"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$p12" -k build.keychain -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security set-keychain-settings -t 3600 build.keychain

      - name: Resolve identities and pin scheme team
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application: " | awk -F'"' '{print $2}' | head -1)
          test -n "$IDENTITY"
          echo "DEVELOPER_ID_APPLICATION=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and archive
        run: |
          xcodebuild archive \
            -project MicSync.xcodeproj \
            -scheme MicSync \
            -configuration Release \
            -archivePath build/MicSync.xcarchive \
            CODE_SIGN_IDENTITY="$DEVELOPER_ID_APPLICATION" \
            DEVELOPMENT_TEAM=MFTS39V3F9 \
            CODE_SIGN_STYLE=Manual

      - name: Export signed app
        run: |
          APP=$(find build/MicSync.xcarchive/Products/Applications -maxdepth 1 -name "MicSync.app")
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          codesign --verify --deep --strict "$APP"

      - name: Notarize and staple
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$ASC_API_KEY_P8_BASE64" | base64 --decode -o ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          xcrun notarytool submit "$APP" \
            --key ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"
          codesign --verify --deep --strict "$APP"
          spctl -a -vv "$APP"

      - name: Verify stapled app
        run: |
          spctl -a -vv "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime"

      - name: Build DMG
        run: |
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/^v//')
          hdiutil create -volname "MicSync" -srcfolder "$STAGE" -ov -format UDZO "MicSync-${VERSION}.dmg"

      - name: Sign and notarize DMG
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/^v//')
          codesign --force --sign "$DEVELOPER_ID_APPLICATION" "MicSync-${VERSION}.dmg"
          xcrun notarytool submit "MicSync-${VERSION}.dmg" \
            --key ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "MicSync-${VERSION}.dmg"

      - name: Checksums
        run: |
          VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/^v//')
          shasum -a 256 "MicSync-${VERSION}.dmg" > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/^v//')
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "MicSync-${VERSION}.dmg" SHA256SUMS
